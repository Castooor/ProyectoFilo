<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR — ¿Imagen o contexto? (Proyección en clase)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">

  <!-- Librería QR Code: qrcode.js (CDN, sin dependencias) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0a0e17;
      --amber: #f59e0b;
      --white: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Fondo sutil con gradiente */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(245,158,11,0.06) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(59,130,246,0.05) 0%, transparent 45%);
      pointer-events: none;
    }

    .slide {
      width: 100%;
      max-width: 820px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* Badge académico */
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--amber);
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.25);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    h1 {
      font-family: 'Newsreader', serif;
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .subtitle {
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      color: var(--muted);
      font-style: italic;
      margin-bottom: 36px;
    }

    /* Contenedor del QR */
    .qr-wrapper {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #qrcode-box {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(245,158,11,0.25), 0 20px 60px rgba(0,0,0,0.5);
    }

    /* En caso de error el QR no se genere */
    #qrcode-box canvas,
    #qrcode-box img {
      border-radius: 6px;
      display: block;
    }

    .url-display {
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      font-weight: 700;
      font-family: 'Courier New', monospace;
      color: var(--amber);
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.2);
      padding: 10px 20px;
      border-radius: 10px;
      letter-spacing: 0.01em;
      word-break: break-all;
    }

    .steps {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: #cbd5e1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      padding: 10px 16px;
      border-radius: 10px;
    }

    .step-num {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--amber);
      color: #000;
      font-weight: 800;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    /* Herramienta de configuración de URL */
    .config-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(17,24,39,0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 16px;
      width: min(340px, calc(100vw - 40px));
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      z-index: 100;
      font-size: 0.85rem;
    }

    .config-panel label {
      display: block;
      color: var(--muted);
      margin-bottom: 6px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .config-panel input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 9px 12px;
      color: #ffffff;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      margin-bottom: 10px;
      outline: none;
    }

    .config-panel input:focus {
      border-color: var(--amber);
    }

    .config-panel button {
      width: 100%;
      background: var(--amber);
      color: #000;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .config-panel button:hover { opacity: 0.85; }

    .config-title {
      font-weight: 700;
      color: var(--white);
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    /* Botón para imprimir / pantalla completa */
    .action-bar {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 200;
    }

    .btn-action {
      background: rgba(17,24,39,0.9);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--white);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-action:hover { background: rgba(30,41,59,0.95); }

    @media print {
      .config-panel, .action-bar { display: none !important; }
      body { background: #000 !important; }
    }

    @media (max-width: 480px) {
      .steps { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>

  <div class="action-bar">
    <button class="btn-action" onclick="toggleFullscreen()">⛶ Pantalla completa</button>
    <button class="btn-action" onclick="window.print()">🖨️ Imprimir</button>
  </div>

  <div class="slide">
    <div class="badge">Exposición Universitaria · Filosofía y Cultura Visual</div>

    <h1>¿Imagen o contexto?</h1>
    <p class="subtitle">Basado en <em>Ante el dolor de los demás</em> — Susan Sontag</p>

    <div class="qr-wrapper">
      <div id="qrcode-box">
        <div id="qrcode"></div>
      </div>
      <div id="url-display" class="url-display">
        tu-usuario.github.io/ProyectoFilo
      </div>
    </div>

    <div class="steps">
      <div class="step">
        <span class="step-num">1</span>
        <span>Conecta al <strong>WiFi del aula</strong></span>
      </div>
      <div class="step">
        <span class="step-num">2</span>
        <span>Escanea el <strong>código QR</strong></span>
      </div>
      <div class="step">
        <span class="step-num">3</span>
        <span>Responde las <strong>3 preguntas</strong></span>
      </div>
    </div>
  </div>

  <!-- Panel de configuración de URL (solo durante la exposición) -->
  <div class="config-panel">
    <div class="config-title">🔧 Configurar URL del QR</div>
    <label>URL del sitio (GitHub Pages o localhost)</label>
    <input
      type="text"
      id="urlInput"
      placeholder="https://tu-usuario.github.io/ProyectoFilo"
      value="http://localhost:5000"
    >
    <button onclick="updateQR()">Actualizar QR</button>
  </div>

  <script>
    let qrInstance = null;

    function renderQR(url) {
      const container = document.getElementById("qrcode");
      container.innerHTML = "";

      qrInstance = new QRCode(container, {
        text: url,
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      document.getElementById("url-display").textContent = url;
      document.getElementById("urlInput").value = url;
    }

    function updateQR() {
      const url = document.getElementById("urlInput").value.trim();
      if (!url) return;
      renderQR(url);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // Detectar si estamos locales o en producción
    const defaultUrl = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
      ? "http://localhost:5000"
      : window.location.origin;

    renderQR(defaultUrl);
  </script>

</body>
</html>
